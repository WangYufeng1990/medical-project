name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medical-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # clean matters: Surefire never deletes old reports, so a stale target/ counts classes
      # that no longer exist.
      # setup-java provides the JDK and the Maven cache; `mvn` itself comes from the
      # Ubuntu runner image. The repository has no wrapper, so ./mvnw would fail on a
      # clean checkout.
      - run: mvn -B clean verify

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medical-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e . --no-deps
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medical-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: medical-web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
