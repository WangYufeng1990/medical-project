spring:
  profiles:
    active: h2

  cache:
    type: redis
    redis:
      time-to-live: 30m

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/medical?useUnicode=true&characterEncoding=utf-8&serverTimezone=America/Chicago&useSSL=true&requireSSL=true&verifyServerCertificate=true&sslMode=VERIFY_CA
    username: root
    password: root

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OKTA_ISSUER_URI:https://dev-00000000.okta.com/oauth2/default}

okta:
  client-id: ${OKTA_CLIENT_ID:your-client-id}
  client-secret: ${OKTA_CLIENT_SECRET:your-client-secret}
  issuer-uri: ${OKTA_ISSUER_URI:https://dev-00000000.okta.com/oauth2/default}

knife4j:
  enable: true

app:
  aes:
    key: ${AES_KEY:change-me-in-production-must-be-32-bytes}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
