spring:
  profiles:
    active: h2

  cache:
    type: redis
    redis:
      time-to-live: 30m

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/medical?useUnicode=true&characterEncoding=utf-8&serverTimezone=America/Chicago&useSSL=true&requireSSL=true&verifyServerCertificate=true&sslMode=VERIFY_CA
    username: root
    password: root

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

knife4j:
  enable: true

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

jwt:
  secret: ${JWT_SECRET:change-me-to-a-256-bit-secret-key-in-production}
  expiration: 7200000
  refresh-expiration: 604800000
