spring:
  # No default active profile — startup fails fast unless SPRING_PROFILES_ACTIVE
  # is explicitly set to prod / dev / h2 (Review III C5). See ProdGuard.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}

  cache:
    type: redis
    redis:
      time-to-live: 30m

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:3306/medical?useUnicode=true&characterEncoding=utf-8&serverTimezone=America/Chicago&useSSL=true&requireSSL=true&verifyServerCertificate=true&sslMode=VERIFY_CA
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OKTA_ISSUER_URI:https://dev-00000000.okta.com/oauth2/default}

okta:
  client-id: ${OKTA_CLIENT_ID:your-client-id}
  client-secret: ${OKTA_CLIENT_SECRET:your-client-secret}
  issuer-uri: ${OKTA_ISSUER_URI:https://dev-00000000.okta.com/oauth2/default}

springdoc:
  swagger-ui:
    path: /doc.html

app:
  security:
    dev-mode: false
    access-token-expiry-seconds: 7200
    refresh-token-expiry-seconds: 2592000
  retention:
    audit-log-days: 2190
    cron: "0 0 3 * * ?"
  aes:
    key: ${AES_KEY}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  # Round 55.2: durable agent dispatch. Off by default - a deployment enables model-
  # assisted drafting deliberately, and nothing else in messaging depends on it.
  agent:
    enabled: ${AGENT_ENABLED:false}
    scheduling-enabled: ${AGENT_SCHEDULING_ENABLED:true}
    base-url: ${AGENT_BASE_URL:http://localhost:8090}
    service-token: ${AGENT_SERVICE_TOKEN:}
    poll-interval-ms: 5000
    batch-size: 10
    lease: 60s
    deadline: 30m
    max-attempts: 3
    base-backoff: 5s
    max-backoff: 5m
    request-timeout: 5s
    capability-ttl: 5m
