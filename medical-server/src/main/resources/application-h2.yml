app:
  aes:
    key: h2-dev-key-for-local-testing-must-be-32-bytes
  security:
    dev-mode: true
  integration:
    api-key: dev-integration-key
  rate-limit:
    export-per-hour: 100

spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/medical_dev;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    username: sa
    password:
  h2:
    console:
      enabled: false
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema.sql
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  cache:
    type: none

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

logging:
  level:
    com.example.medical: debug

okta:
  client-id:
  client-secret:
  issuer-uri:
